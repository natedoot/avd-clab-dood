  ip_address: 10.255.10.8/32
- name: Loopback12
  description: DIAG_VRF_VRF12
  shutdown: false
  vrf: VRF12
  ip_address: 10.255.12.8/32
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: default
  ip_address: 192.168.0.108/24
  type: oob
  gateway: 192.168.0.1
metadata:
  is_deployed: true
  platform: ceos
  fabric_name: FABRIC
  validate_hardware:
    enabled: false
mlag_configuration:
  domain_id: DC1_L3_LEAF3
  local_interface: Vlan4094
  peer_address: 10.255.1.72
  peer_link: Port-Channel3
  reload_delay_mlag: '300'
  reload_delay_non_mlag: '330'
ntp:
  local_interface:
    name: Management1
    vrf: default
  servers:
  - name: pool.ntp.org
    iburst: true
    preferred: true
  vrf: default
port_channel_interfaces:
- name: Port-Channel3
  description: MLAG_dc1-leaf3a_Port-Channel3
  shutdown: false
  switchport:
    enabled: true
    mode: trunk
    trunk:
      groups:
      - MLAG
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 10.255.0.0/27 eq 32
  - sequence: 20
    action: permit 10.255.1.0/27 eq 32
- name: PL-MLAG-PEER-VRFS
  sequence_numbers:
  - sequence: 10
    action: permit 10.255.1.104/31
route_maps:
- name: RM-MLAG-PEER-IN
  sequence_numbers:
  - sequence: 10
    type: permit
    description: Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
    set:
    - origin incomplete
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
- name: RM-CONN-2-BGP-VRFS
  sequence_numbers:
  - sequence: 10
    type: deny
    match:
    - ip address prefix-list PL-MLAG-PEER-VRFS
  - sequence: 20
    type: permit
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65103'
  router_id: 10.255.0.8
  maximum_paths:
    paths: 4
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: MLAG-IPv4-UNDERLAY-PEER
    metadata:
      type: ipv4
    remote_as: '65103'
    description: dc1-leaf3a
    next_hop_self: true
    send_community: all
    maximum_routes: 256000
    route_map_in: RM-MLAG-PEER-IN
  - name: IPv4-UNDERLAY-PEERS
    metadata:
      type: ipv4
    send_community: all
    maximum_routes: 256000
  - name: EVPN-OVERLAY-PEERS
    metadata:
      type: evpn
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 3
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 10.255.1.104
    peer_group: MLAG-IPv4-UNDERLAY-PEER
    metadata:
      peer: dc1-leaf3a
    description: dc1-leaf3a_Vlan4093
  - ip_address: 10.255.255.20
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: dc1-spine1
    description: dc1-spine1_Ethernet6
  - ip_address: 10.255.255.22
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: dc1-spine2
    description: dc1-spine2_Ethernet6
  - ip_address: 10.255.0.1
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: dc1-spine1
    description: dc1-spine1_Loopback0
  - ip_address: 10.255.0.2
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: dc1-spine2
    description: dc1-spine2_Loopback0
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  vlans:
  - id: 11
    metadata:
      tenants:
      - TENANT1
    rd: 10.255.0.8:10011
    route_targets:
      both:
      - 10011:10011
    redistribute_routes:
    - learned
  - id: 21
    metadata:
      tenants:
      - TENANT1
    rd: 10.255.0.8:10021
    route_targets:
      both:
      - 10021:10021
    redistribute_routes:
    - learned
  - id: 22
    metadata:
      tenants:
      - TENANT1
    rd: 10.255.0.8:10022
    route_targets:
      both:
      - 10022:10022
    redistribute_routes:
    - learned
  - id: 3401
    metadata:
      tenants:
      - TENANT1
    rd: 10.255.0.8:13401
    route_targets:
      both:
      - 13401:13401
    redistribute_routes:
    - learned
  - id: 3402
    metadata:
      tenants:
      - TENANT1
    rd: 10.255.0.8:13402
    route_targets:
      both:
      - 13402:13402
    redistribute_routes:
    - learned
  address_family_evpn:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: true
  address_family_ipv4:
    peer_groups:
    - name: MLAG-IPv4-UNDERLAY-PEER
      activate: true
    - name: IPv4-UNDERLAY-PEERS
      activate: true
    - name: EVPN-OVERLAY-PEERS
      activate: false
  vrfs:
  - name: VRF10
    rd: 10.255.0.8:10
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - '10:10'
      export:
      - address_family: evpn
        route_targets:
        - '10:10'
    router_id: 10.255.0.8
    neighbors:
    - ip_address: 10.255.1.104
      peer_group: MLAG-IPv4-UNDERLAY-PEER
      description: dc1-leaf3a_Vlan3009
    redistribute:
      connected:
        enabled: true
        route_map: RM-CONN-2-BGP-VRFS
  - name: VRF12
    rd: 10.255.0.8:12
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - '12:12'
      export:
      - address_family: evpn
        route_targets:
        - '12:12'
    router_id: 10.255.0.8
    neighbors:
    - ip_address: 10.255.1.104
      peer_group: MLAG-IPv4-UNDERLAY-PEER
      description: dc1-leaf3a_Vlan3011
    redistribute:
      connected:
        enabled: true
        route_map: RM-CONN-2-BGP-VRFS
